<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="xlBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="45%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="xlAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="xlGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <filter id="xlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#xlBgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#xlGrid)" />

  <!-- Ambient Glow -->
  <circle cx="1000" cy="110" r="150" fill="#2DD4BF" opacity="0.14" filter="url(#xlGlow)" />
  <circle cx="240" cy="280" r="140" fill="#34D399" opacity="0.10" filter="url(#xlGlow)" />

  <!-- Status Badge -->
  <g transform="translate(80, 52)">
    <rect width="250" height="32" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1" />
    <circle cx="16" cy="16" r="4.5" fill="#34D399" />
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#A7F3D0" letter-spacing="1.2">CLIENT-SIDE DATA UTILITY</text>
  </g>

  <!-- Title & Narrative -->
  <g transform="translate(80, 142)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Divisor de Excel <tspan fill="url(#xlAccentGrad)">Web</tspan>
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#E6FFFA" letter-spacing="0.2">
      Segmentador Masivo de Hojas de Cálculo (.xlsx, .xls, .csv) en el Navegador
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#5EEAD4">
      SheetJS Engine · JSZip Batch Export · Zero Server Upload · Preservación de Encabezados
    </text>
  </g>

  <!-- Key Metrics Row -->
  <g transform="translate(80, 260)">
    <rect x="0" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#5EEAD4" text-transform="uppercase">PRIVACIDAD</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#F0FDF4">100% In-Browser</text>

    <rect x="200" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#5EEAD4" text-transform="uppercase">MODOS DIVISIÓN</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#FCD34D">Filas · Partes · Columna</text>

    <rect x="400" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#5EEAD4" text-transform="uppercase">EMPAQUE</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#38BDF8">Descarga ZIP / XLSX</text>
  </g>

  <!-- Right Visual: Spreadsheet Split Graphic -->
  <g transform="translate(910, 75)">
    <rect x="0" y="0" width="220" height="190" rx="14" fill="rgba(6, 78, 59, 0.85)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.5" />
    
    <!-- Top Big Sheet -->
    <rect x="35" y="30" width="150" height="45" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="#34D399" stroke-width="1.5" />
    <line x1="35" y1="45" x2="185" y2="45" stroke="#34D399" stroke-width="1" />
    <line x1="85" y1="30" x2="85" y2="75" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <line x1="135" y1="30" x2="135" y2="75" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    
    <!-- Split Arrow -->
    <path d="M 110 82 L 110 100 M 105 95 L 110 100 L 115 95" fill="none" stroke="#2DD4BF" stroke-width="2" />
    
    <!-- Two smaller sheets below -->
    <rect x="25" y="110" width="75" height="50" rx="5" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5" />
    <line x1="25" y1="123" x2="100" y2="123" stroke="#10B981" stroke-width="1" />
    <text x="35" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="10" font-weight="700" fill="#A7F3D0">PARTE 1</text>
    
    <rect x="120" y="110" width="75" height="50" rx="5" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5" />
    <line x1="120" y1="123" x2="195" y2="123" stroke="#10B981" stroke-width="1" />
    <text x="130" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="10" font-weight="700" fill="#A7F3D0">PARTE 2</text>
  </g>
</svg>